[package]
name = "cove-notes"
version = "0.1.0"
description = "Joyful Notion-like Desktop Note Taking Application"
authors = ["Cove Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-single-instance = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
argon2 = "0.5"
pbkdf2 = "0.12"
sha2 = "0.10"
# Direct keychain access with a hard-coded service name (replaces the generic
# tauri-plugin-keyring, whose permissions exposed the whole OS credential store).
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
# WAL-safe backup via VACUUM INTO; same sqlx/libsqlite3 already pulled in by tauri-plugin-sql.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
# Bookmark link previews: Rust-side fetch keeps the WebView CSP free of remote hosts.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[dev-dependencies]
# #[tokio::test] for the WAL-backup integration test (runtime already in-tree via sqlx).
tokio = { version = "1", features = ["rt", "macros"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
